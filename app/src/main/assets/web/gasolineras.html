<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="app">Gasolineras</title>
<meta name="theme-color" content="#f6f5f4">
<link rel="stylesheet" href="/leaflet/leaflet.css">
<style>
/* fuente Nunito (SIL Open Font License 1.1, ver nunito-LICENCIA.txt), guardada aquí */
@font-face { font-family: "Nunito"; src: url("/nunito.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; }
/* Siempre tema claro: fondo claro y letra oscura */
:root { color-scheme: light;
  --fondo: #f6f5f4; --tarjeta: #ffffff; --texto: #241f31; --suave: #6f6a78; --acento: #3584e4; --verde: #26a269;
  --sel: #e6effb; --rojo: #c01c28; --rojo-fondo: #fde4e4; --borde: #78858f; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.4 "Nunito", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
button { font: inherit; color: inherit; background: var(--tarjeta); border-radius: 12px; min-height: 48px; padding: 0 16px;
  border: 2px solid var(--borde); font-weight: 700; cursor: pointer; }
button:active { background: var(--sel); }
button.primario { background: var(--acento); color: #fff; border-color: var(--acento); }
.cab { display: flex; align-items: center; margin: 4px 0 12px; }
.cab > * + * { margin-left: 10px; }   /* en vez de gap: en flex solo existe desde Chrome 84 */
.cab h1 { flex: 1; min-width: 0; margin: 0; font-size: 1.6rem; display: flex; align-items: center; }
.cab h1 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* el título cede sitio: el botón Mapa/Lista nunca se sale */
.cab button { flex: none; }
.cab h1 img { margin-right: 10px; }
.cab img { width: 36px; height: 36px; }
button.icono { width: 48px; flex: none; padding: 0; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }
button.icono svg { width: 26px; height: 26px; display: block; }
/* de qué hora son los precios (en lugar del botón de actualizar: la app los baja sola si tienen más de 30 min) */
.hora { flex: none; text-align: center; color: var(--suave); font-size: .72rem; line-height: 1.15; white-space: nowrap; }
.hora b { display: block; color: var(--texto); font-size: 1rem; }
/* ventana estrecha (con letra grande): se aprieta la cabecera */
.estrecho .cab h1 { font-size: 1.3rem; min-width: 0; }
.estrecho .cab h1 img { display: none; }
.estrecho .cab > * + * { margin-left: 6px; }
.estrecho button { padding: 0 10px; }
.estrecho button.icono { width: 44px; padding: 0; }
.estrecho main { padding-left: 10px; padding-right: 10px; }
.estrecho .precio { font-size: 1.1rem; padding-right: 8px; }
.chips { display: flex; flex-wrap: wrap; margin: 0 -6px 6px 0; }
.chips button { margin: 0 6px 6px 0; flex: 1 1 auto; min-height: 44px; padding: 0 10px; font-size: .95rem; }
.chips button.on, .orden button.on { background: var(--acento); color: #fff; border-color: var(--acento); }
.isla { background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
.isla input[type=range] { width: 100%; height: 36px; accent-color: var(--acento); margin: 4px 0; }
.orden { display: flex; align-items: center; margin-top: 4px; }
.orden button { margin-left: 6px; }
.orden span { font-weight: 700; margin-right: 4px; }
.orden button { min-height: 40px; padding: 0 12px; }
label.solo { display: flex; align-items: center; margin-top: 8px; min-height: 40px; font-weight: 700; }
label.solo input { margin-right: 10px; width: 22px; height: 22px; accent-color: var(--acento); }
h2 { font-size: 1.05rem; margin: 14px 4px 8px; color: var(--suave); }
.hueco { position: relative; margin-bottom: 10px; border-radius: 14px; overflow: hidden; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.detras { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 14px; background: var(--sel); display: flex; align-items: center;
  justify-content: space-between; padding: 0 18px; font-weight: 800; font-size: .9rem; color: var(--texto); }
.detras .lado { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; opacity: .35; visibility: hidden; transition: opacity .15s, transform .15s; }
.detras .lado svg { width: 28px; height: 28px; flex: none; }
.detras .lado .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* solo se ve el lado que se está destapando (fila a la derecha: el izquierdo; a la izquierda: el derecho) */
.detras.ver-izq .lado.izq, .detras.ver-der .lado.der { visibility: visible; }
.detras.listo { background: #d6eefb; }
.detras.listo .lado { opacity: 1; transform: scale(1.08); }
.fila { position: relative; display: flex; align-items: center; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 14px;
  cursor: pointer; transition: transform .25s ease; }
.fila.arrastrando { transition: none; }
.fila:active { background: var(--sel); }
@keyframes asoma { 0% { transform: translateX(0); } 30% { transform: translateX(-70px); } 55% { transform: translateX(-70px); } 100% { transform: translateX(0); } }
.fila.pista { animation: asoma 1.6s ease-in-out; }
.detras.pista .lado.der { visibility: visible; opacity: 1; }
.marca { flex: none; width: 24px; height: 24px; margin-right: 8px; }
.marca svg, h2 svg { width: 100%; height: 100%; display: block; }
h2 .marca { display: inline-block; vertical-align: middle; width: 20px; height: 20px; margin: 0 6px 2px 0; }
.cuerpo { flex: 1; min-width: 0; padding: 10px 12px; }
.nombre { font-weight: 800; font-size: 1.1rem; overflow-wrap: anywhere; }
.sub { color: var(--suave); font-size: .85rem; line-height: 1.3; overflow-wrap: anywhere; }
.ins { display: inline-block; font-size: .85rem; font-weight: 700; padding: 1px 10px; border-radius: 999px; margin-top: 4px;
  background: var(--sel); color: var(--texto); border: 1.5px solid var(--borde); }
.ins.mal { background: var(--rojo-fondo); color: var(--rojo); border-color: var(--rojo); }
.precio { flex: none; font-weight: 800; font-size: 1.25rem; padding-right: 12px; white-space: nowrap; }
.precio.barata { color: var(--verde); }
.msg { text-align: center; color: var(--suave); margin: 30px 12px; }
.msg button { margin: 8px 4px 0; }
.pie { text-align: center; color: var(--suave); font-size: .9rem; margin-top: 14px; }
#mapa { height: 58vh; min-height: 320px; border: 2px solid var(--borde); border-radius: 14px; margin-bottom: 10px; }
#ficha .msg { margin: 0 0 10px; padding: 18px 12px; background: var(--tarjeta); border: 2px dashed var(--borde); border-radius: 14px; }
.mk { display: inline-block; transform: translate(-50%, -50%); background: #fff; border: 2px solid var(--borde); border-radius: 10px;
  padding: 1px 6px; font: 800 13px "Nunito", sans-serif; color: var(--texto); white-space: nowrap; }
.mk.b { background: var(--verde); border-color: var(--verde); color: #fff; }
.yo { width: 16px; height: 16px; border-radius: 50%; background: #3584e4; border: 3px solid #fff; box-shadow: 0 0 0 2px #3584e4; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="cab">
    <h1><img src="/logo.svg" alt=""><span data-t="app">Gasolineras</span></h1>
    <span class="hora" id="hora"></span>
    <button id="bvista" data-t="mapa">Mapa</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="isla" id="opciones">
    <div id="rtxt">Radio: 12 km</div>
    <input type="range" id="radio" min="1" max="50" step="1" value="12">
    <div class="orden"><span data-t="orden">Orden:</span><button id="oprecio" data-t="precio">Precio</button><button id="odist" data-t="distancia">Distancia</button></div>
    <label class="solo"><input type="checkbox" id="solo"> <span data-t="solo_abiertas">Solo abiertas ahora</span></label>
  </div>
  <div id="msg" class="msg" hidden></div>
  <div id="vlista"></div>
  <div id="vmapa" hidden><div id="ficha"></div><div id="mapa"></div></div>
  <div class="pie" id="pie"></div>
</main>
<script src="/leaflet/leaflet.js"></script>
<script src="/textos.js"></script>
<script>
"use strict";
// Letra grande de Android: zoom CSS solo en los bloques que NO son el mapa (el zoom sobre un ancestro de Leaflet
// descoloca toques y arrastres). Como en Recordatorios: tope 1,3 y nunca menos de 300 px de ancho útil.
let Z = 1;
const ZOOM_SEL = ".cab, .chips, .isla, #msg, #vlista, #ficha, .pie";
function ponerZoom() {
  let z = 1;
  try { const e = Math.min(1.3, Number(window.Gas.escala()) || 1); if (e > 1.01) z = e; } catch (e) {}
  const ancho = window.innerWidth || 0;
  if (z > 1 && ancho) z = Math.max(1, Math.min(z, ancho / 300));
  if (Math.abs(z - 1) <= .01) z = 1;
  Z = z;
  document.querySelectorAll(ZOOM_SEL).forEach(el => { el.style.zoom = z === 1 ? "" : z; });
  document.documentElement.classList.toggle("estrecho", !!ancho && ancho / z < 360);
}
ponerZoom();
window.addEventListener("resize", ponerZoom);
const COMB = ["95", "98", "Diésel", "Diésel+", "GLP"];
const $ = id => document.getElementById(id);
function ls(k, d) { try { const v = localStorage.getItem("g_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function guarda(k, v) { try { localStorage.setItem("g_" + k, JSON.stringify(v)); } catch (e) {} }
const S = { comb: ls("comb", 0), radio: ls("radio", 12), orden: ls("orden", "precio"), solo: ls("solo", false),
  vista: ls("vista", "lista"), favs: new Set(ls("favs", [])), datos: null, fecha: "", sinRed: false, cargando: false, abierta: null };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fp = p => tr("precio_fmt", p);
const MINUS = new Set(["de", "del", "la", "las", "los", "el", "y", "en", "a"]);
function bonito(t) {
  return String(t || "").toLowerCase().split(/(\s+|,|\.|\/|-|\()/).map((w, i) => {
    if (!/[a-zñáéíóúü]/.test(w)) return w;
    if (/^[ivxl]+$/.test(w) && w !== "l") return w.toUpperCase();            // números romanos
    if (w === "km") return "km";
    if (w.length <= 3 && !/[aeiouáéíóú]/.test(w)) return w.toUpperCase();   // N, SG, VA… (códigos de carretera)
    if (i > 0 && MINUS.has(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join("");
}
const fk = k => tr("km_fmt", k);

function cargar(forzar) {
  S.cargando = true; pinta();
  Gas.cargar(S.comb, S.radio, !!forzar);
}

window.alNativo = function (m) {
  // si se cambia de combustible o de radio deprisa, las respuestas pueden llegar desordenadas: se ignoran las viejas
  if (m.tipo === "datos" && (m.comb !== S.comb || m.radio !== S.radio)) return;
  if (m.tipo === "cargando") { S.cargando = true; muestraMsg(null); }
  else if (m.tipo === "datos") {
    S.cargando = false; S.datos = m; S.fecha = m.fecha; S.sinRed = m.sinRed; S.recibido = Date.now(); muestraMsg(null);
  } else {
    S.cargando = false; S.datos = null;
    if (m.tipo === "sinPermiso") muestraMsg(tr("sin_permiso"),
      [[tr("reintentar"), () => Gas.reintentar()], [tr("ajustes_app"), () => Gas.ajustes()]]);
    else if (m.tipo === "sinUbicacion") muestraMsg(tr("sin_ubic"), [[tr("reintentar"), () => cargar(false)]]);
    else muestraMsg(m.mensaje || tr("error"), [[tr("reintentar"), () => cargar(true)]]);
  }
  pinta();
};
window.atras = function () {
  if (S.vista !== "mapa") return false;
  if ($("ficha").dataset.id) { delete $("ficha").dataset.id; fichaVacia(); return true; }
  S.vista = "lista"; guarda("vista", S.vista); pinta(); return true;
};
// en el mapa, sin gasolinera elegida: aviso en el sitio de la ficha
function fichaVacia() { $("ficha").innerHTML = '<div class="msg">' + esc(tr("toca_gas")) + '</div>'; }

function muestraMsg(t, botones) {
  const m = $("msg");
  if (t === null) { m.hidden = true; return; }
  m.hidden = false; m.innerHTML = "<div>" + esc(t) + "</div>";
  (botones || []).forEach(([n, f]) => { const b = document.createElement("button"); b.textContent = n; b.onclick = f; m.appendChild(b); });
}

// lista visible: abiertas, ordenada; ya viene filtrada por radio y combustible
function visibles() {
  if (!S.datos) return [];
  let l = S.datos.lista.filter(g => !(S.solo && g.ab === 2));
  l.sort(S.orden === "precio" ? (a, b) => a.p - b.p || a.km - b.km : (a, b) => a.km - b.km || a.p - b.p);
  return l;
}

function puntos(cx, cy, R, r) { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; p.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1)); } return p.join(" "); }
const EST = puntos(24, 25.5, 19, 8.6);
const estrella = on => '<svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="' + EST + '" fill="' + (on ? "#81D4FA" : "#FFFFFF") +
  '" stroke="#78858F" stroke-width="3.2" stroke-linejoin="round"/></svg>';

function filaHtml(g, min) {
  const et = g.h24 ? '<span class="ins">' + esc(tr("h24")) + '</span>' : g.ab === 2 ? '<span class="ins mal">' + esc(tr("cerrada")) + '</span>' : "";
  const sub = [bonito(g.l), fk(g.km)].filter(Boolean).join(" · ");
  const fav = S.favs.has(g.id), txt = esc(tr(fav ? "quitar_fav" : "anadir_fav"));
  return '<div class="hueco" data-id="' + esc(g.id) + '"><div class="detras"><span class="lado izq">' + estrella(!fav) + '<span class="t">' + txt +
    '</span></span><span class="lado der"><span class="t">' + txt + '</span>' + estrella(!fav) + '</span></div>' +
    '<div class="fila"><div class="cuerpo"><div class="nombre">' + esc(g.r) + '</div>' +
    (g.d ? '<div class="sub">' + esc(bonito(g.d)) + '</div>' : "") + '<div class="sub">' + esc(sub) +
    '</div>' + et + '</div>' + (fav ? '<span class="marca" role="img" aria-label="' + esc(tr("favorita")) + '">' + estrella(true) + '</span>' : "") +
    '<div class="precio' + (g.p === min ? " barata" : "") + '">' + fp(g.p) + '</div></div></div>';
}

// cada fila se desliza hacia un lado para marcar/quitar la favorita; tocarla abre el mapa
function enlaza(cont, porId) {
  cont.querySelectorAll(".hueco").forEach(h => {
    const g = porId[h.dataset.id], f = h.querySelector(".fila"), d = h.querySelector(".detras");
    let a = null, movio = false;
    f.onclick = () => { if (movio) { movio = false; return; } Gas.abrirMapa(g.lat, g.lon, g.r); };
    const vuelve = () => { f.classList.remove("arrastrando"); f.style.transform = ""; d.classList.remove("listo"); d.classList.remove("ver-izq"); d.classList.remove("ver-der"); };
    h.onpointerdown = e => { a = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, on: false, w: h.offsetWidth }; movio = false; };
    h.onpointermove = e => {
      if (!a || e.pointerId !== a.id) return;
      const dx = (e.clientX - a.x0) / Z, dy = (e.clientY - a.y0) / Z;   // en unidades de la página (con zoom CSS)
      if (!a.on) {
        if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
          a.on = true; movio = true; f.classList.add("arrastrando");
          try { h.setPointerCapture(e.pointerId); } catch (x) {}
        } else return;
      }
      a.dx = dx; f.style.transform = "translateX(" + dx + "px)";
      d.classList.toggle("ver-izq", dx > 0); d.classList.toggle("ver-der", dx < 0);
      d.classList.toggle("listo", Math.abs(dx) > a.w * 0.35);
    };
    h.onpointerup = () => {
      if (!a) return;
      const { on, dx, w } = a; a = null;
      if (!on) return;
      if (Math.abs(dx) > w * 0.35) {
        f.classList.remove("arrastrando");
        f.style.transform = "translateX(" + (dx > 0 ? w : -w) + "px)";
        guarda("desliza_usado", true);
        setTimeout(() => {
          S.favs.has(g.id) ? S.favs.delete(g.id) : S.favs.add(g.id);
          guarda("favs", [...S.favs]); pinta();
        }, 220);
      } else vuelve();
      setTimeout(() => { movio = false; }, 0);
    };
    h.onpointercancel = () => { if (a && a.on) vuelve(); a = null; };
  });
}

// pista: la primera fila asoma hacia la izquierda y vuelve; una sola vez por apertura
const APERTURAS = ls("aperturas", 0) + 1; guarda("aperturas", APERTURAS);
let pistaHecha = false;
function pista() {
  if (pistaHecha || S.vista !== "lista") return;
  const h = $("vlista").querySelector(".hueco"); if (!h) return;
  pistaHecha = true;
  if (ls("desliza_usado", false) || !(APERTURAS <= 3 || APERTURAS % 10 === 0)) return;
  setTimeout(() => {
    const hh = $("vlista").querySelector(".hueco"); if (!hh || S.vista !== "lista") return;
    const f = hh.querySelector(".fila"), d = hh.querySelector(".detras");
    f.classList.add("pista"); d.classList.add("pista");
    setTimeout(() => { f.classList.remove("pista"); d.classList.remove("pista"); }, 1700);
  }, 1000);
}

let mapa = null, capa = null;
function pinta() {
  $("bvista").textContent = S.vista === "mapa" ? tr("lista") : tr("mapa");
  $("chips").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === S.comb));
  $("oprecio").classList.toggle("on", S.orden === "precio"); $("odist").classList.toggle("on", S.orden === "distancia");
  const l = visibles();
  $("rtxt").textContent = tr("radio", S.radio) + (S.datos ? " · " + tr("n_gas", l.length) : S.cargando ? " · " + tr("buscando") : "");
  $("pie").textContent = S.cargando ? tr("cargando") : S.fecha ? tr("pie", S.fecha, S.sinRed) : "";
  const hm = /(\d{1,2}):(\d{2})/.exec(S.fecha || "");   // solo la hora; la fecha completa sigue en el pie
  $("hora").innerHTML = S.cargando ? "…" : hm ? esc(tr("actualizado")) + "<b>" + hm[1].padStart(2, "0") + ":" + hm[2] + "</b>" : "";
  const porId = {}; l.forEach(g => porId[g.id] = g);
  const min = l.length ? Math.min(...l.map(g => g.p)) : 0;
  $("vlista").hidden = S.vista !== "lista"; $("vmapa").hidden = S.vista !== "mapa"; $("opciones").hidden = S.vista === "mapa";
  if (S.vista === "lista") {
    const fav = l.filter(g => S.favs.has(g.id)), resto = l.filter(g => !S.favs.has(g.id));
    let h = "";
    if (fav.length) h += "<h2><span class=\"marca\">" + estrella(true) + "</span>" + esc(tr("favoritas")) + "</h2>" + fav.map(g => filaHtml(g, min)).join("") + (resto.length ? "<h2>" + esc(tr("cerca")) + "</h2>" : "");
    h += resto.map(g => filaHtml(g, min)).join("");
    if (S.datos && !l.length) h = '<div class="msg">' + esc(tr("sin_gas")) + '</div>';
    $("vlista").innerHTML = h; enlaza($("vlista"), porId); pista();
  } else pintaMapa(l, porId, min);
}

function fichaDe(g, min) {
  const f = $("ficha"); f.innerHTML = filaHtml(g, min); enlaza(f, { [g.id]: g });
}

function pintaMapa(l, porId, min) {
  if (!mapa) {
    // canvas con margen de toque amplio: los puntos son pequeños para el dedo
    // sin fundidos ni animar las etiquetas al hacer zoom: en el WebView del móvil es lo que más tironea
    mapa = L.map("mapa", { attributionControl: true, renderer: L.canvas({ tolerance: 12 }),
      fadeAnimation: false, markerZoomAnimation: false });
    mapa.attributionControl.setPrefix(false);
    // teselas: no pedirlas a mitad de zoom ni de arrastre, y guardar más alrededor para que al mover no salgan huecos
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap",
      updateWhenZooming: false, updateWhenIdle: true, keepBuffer: 4 }).addTo(mapa);
    capa = L.layerGroup().addTo(mapa);
    mapa.setView([40.4, -3.7], 6);
  }
  mapa.invalidateSize();
  const fa = $("ficha").dataset.id;
  if (!S.datos) { capa.clearLayers(); mapa._clave = null; $("ficha").innerHTML = ""; return; }
  const d = S.datos, centro = [d.lat, d.lon];
  // las marcas solo se rehacen si cambian los datos o los filtros (no al tocar una o al cambiar el orden)
  const clave = [d.fecha, d.lat, d.lon, S.radio, S.comb, S.solo, l.length].join("|");
  if (mapa._clave === clave) { if (fa && porId[fa]) fichaDe(porId[fa], min); else fichaVacia(); return; }
  mapa._clave = clave;
  capa.clearLayers();
  L.marker(centro, { icon: L.divIcon({ className: "", html: '<div class="yo" style="transform:translate(-50%,-50%)"></div>', iconSize: [0, 0] }), interactive: false }).addTo(capa);
  const circ = L.circle(centro, { radius: S.radio * 1000, color: "#3584e4", weight: 2, fillOpacity: 0.05 }).addTo(capa);
  // las 30 más baratas con etiqueta de precio; el resto, puntos dibujados en canvas (mucho más ligeros)
  // al tocar un punto se convierte en etiqueta con su precio (y sale su ficha, como en las demás)
  const etiqueta = g => {
    const m = L.marker([g.lat, g.lon], { icon: L.divIcon({ className: "", html: '<div class="mk' + (g.p === min ? " b" : "") + '">' + tr("num3", g.p) + "</div>", iconSize: [0, 0] }) });
    m.on("click", () => { $("ficha").dataset.id = g.id; fichaDe(g, min); });
    return m.addTo(capa);
  };
  l.slice().sort((a, b) => a.p - b.p).forEach((g, i) => {
    if (i < 30) { etiqueta(g); return; }
    const c = L.circleMarker([g.lat, g.lon], { radius: 8, color: "#78858f", weight: 2, fillColor: "#ffffff", fillOpacity: 1 }).addTo(capa);
    c.on("click", () => { capa.removeLayer(c); etiqueta(g); $("ficha").dataset.id = g.id; fichaDe(g, min); });
  });
  if (!(mapa._centrado === S.radio + "|" + d.lat + "|" + d.lon)) { mapa.fitBounds(circ.getBounds()); mapa._centrado = S.radio + "|" + d.lat + "|" + d.lon; }
  if (fa && porId[fa]) fichaDe(porId[fa], min); else fichaVacia();
}

COMB.forEach((n, i) => {
  const b = document.createElement("button"); b.textContent = tr("c" + i);
  b.onclick = () => { if (S.comb === i) return; S.comb = i; guarda("comb", i); cargar(false); };
  $("chips").appendChild(b);
});
$("radio").value = S.radio; $("solo").checked = S.solo;
$("radio").oninput = e => { S.radio = +e.target.value; $("rtxt").textContent = tr("radio", S.radio); };
$("radio").onchange = () => { guarda("radio", S.radio); cargar(false); };
$("oprecio").onclick = () => { S.orden = "precio"; guarda("orden", S.orden); pinta(); };
$("odist").onclick = () => { S.orden = "distancia"; guarda("orden", S.orden); pinta(); };
$("solo").onchange = e => { S.solo = e.target.checked; guarda("solo", S.solo); pinta(); };
$("bvista").onclick = () => { S.vista = S.vista === "mapa" ? "lista" : "mapa"; guarda("vista", S.vista); pinta(); };
traducirPagina(); pinta(); cargar(false);
// al volver a la app tras más de 30 min en segundo plano, se vuelve a cargar (Datos.obtener baja precios nuevos si los guardados son viejos)
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !S.cargando && S.recibido && Date.now() - S.recibido > 30 * 60 * 1000) cargar(false);
});
</script>
